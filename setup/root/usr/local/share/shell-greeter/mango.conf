# Login screen compositor (greetd runs: mango -c /usr/local/share/shell-greeter/mango.conf -s .../start).
# Deliberately no keybinds: nothing can be launched from the login screen except logging in.
animations=0
blur=0
shadows=0
xwayland_persistence=0

# input, copied from ~/.config/mango/dms/input.conf
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1

# cursor: Breeze Light (same as the desktop)
cursor_theme=Breeze_Light
cursor_size=24
