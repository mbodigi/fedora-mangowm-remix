[main]
summary=ThinkPad on battery: powersave plus device runtime power management
include=powersave

[usb]
autosuspend=1

[script]
script=${i:PROFILE_DIR}/script.sh

# powersave governor, but hardware boost (HWP) may ramp up quickly when something needs it:
# balance_power instead of powersave's strict "power"
[cpu]
governor=powersave
energy_performance_preference=balance_power
