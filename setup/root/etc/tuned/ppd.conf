[main]
# The default PPD profile (plugged in: performance)
default=performance
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=powersave
balanced=balanced
performance=throughput-performance

[battery]
# PPD = TuneD. On battery every choice saves power (laptop-battery-performance = laptop-battery)
balanced=laptop-battery
performance=laptop-battery-performance
