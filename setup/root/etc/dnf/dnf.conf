# see `man dnf.conf` for defaults and possible options

[main]
max_parallel_downloads=15
clean_requirements_on_remove=True
fastestmirror=True
defaultyes=True
# no optional extras ("weak dependencies"); install them by name when you want them
install_weak_deps=False
# repo overrides (no countme, skip extra repos that are down): repos.override.d/90-vayu.repo
