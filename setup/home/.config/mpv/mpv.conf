# mpv settings (also used by Celluloid via its "mpv configuration file" option)

# Video: decode on the Intel GPU (VA-API) when the codec is supported (H.264/HEVC on this Skylake),
# fall back to software otherwise
hwdec=auto-safe
vo=gpu-next

# Resume where you left off
save-position-on-quit=yes

# Subtitles: JetBrains Mono with a soft shadow instead of a thick outline
sub-font="JetBrains Mono"
sub-font-size=36
sub-border-size=0
sub-shadow-offset=2
sub-shadow-color="#000000C0"
sub-color="#F0F0F0"

# Screenshots (press s) next to the desktop screenshots
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png
screenshot-template="mpv_%F_%P"
