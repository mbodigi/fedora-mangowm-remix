<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- JetBrains Mono everywhere: generic sans-serif (websites without their own font) and monospace -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
